[build-system]
requires = [
    "setuptools>=68.0",
    "wheel",
    "cmake>=3.22",
    "ninja>=1.11",
    "torch>=2.11.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "vkwr"
version = "0.1.0"
description = "A high-concurrency pure Linear Attention inference engine"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.11.0",
    "numpy",
    "ninja",
    "pydantic>=2.12.0",
    "uvicorn>=0.49.0",
    "fastapi>=0.136.3",
    "msgspec>=0.21.1",
    "cloudpickle>=3.1.2",
    "pyzmq>=27.1.0",
]

[project.scripts]
vkwr = "vkwr.entrypoints.__main__:main"


[dependency-groups]
dev = ["ruff>=0.4.0", "pytest>=7.0", "pytest-cov", "httpx>=0.27.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vkwr*"]
exclude = ["tests*", "third_party*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "I"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
